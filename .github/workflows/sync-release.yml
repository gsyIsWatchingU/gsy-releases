name: 同步产品更新索引

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-release.mjs "$GITHUB_EVENT_PATH"
      - run: node --test
      - name: 提交产品更新索引
        shell: bash
        run: |
          if git diff --quiet -- products; then
            echo "索引无需更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products
          git commit -m "release: sync ${GITHUB_REF_NAME}"
          git push origin HEAD:main
